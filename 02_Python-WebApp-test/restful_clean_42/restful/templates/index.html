<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pokémon List</title>
</head>
<body>
	<h1>Pokémon list</h1>
	<a href="{{ url_for('add_creature') }}">Add new Pokémon</a>
	<ul>
	{% for creature in creatures %}
		<li>
			<a href="{{ url_for('view_creature', id = creature.id) }}">
			<strong>{{ creature.name }}</strong>
			</a> - {{ creature.types }}<br>

			<form action="{{ url_for('delete_creature', id = creature.id) }}" method="POST" style="display:inline;">
				<button type="submit">Delete</button>
			</form>
			<a href="{{ url_for('edit_creature', id=creature.id) }}">Modify</a>
		</li>
	{% else %}
		<li>No creature disponible.</li>
	{% endfor %}
	</ul>
	<br>
	<a href="/this-route-does-not-exist">
    Test 404
	</a>

</body>
</html>

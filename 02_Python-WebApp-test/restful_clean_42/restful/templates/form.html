<!-- templates/form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>{{ 'Modify' if creature else 'Enter' }} Creature</title>
	<script defer src="/static/script.js"></script>
</head>
<body>
	   <h1>{{ 'Modify' if creature else 'Enter' }} Creature</h1>
	<form method="POST">
		<label for="name">Name Pokémon</label><br>
		<input type="text" id="name" name="name" required value="{{ creature.name if creature else '' }}" {% if creature %}readonly{% endif %}><br>


	{% if creature %}
		<label for="height">Height</label><br>
		<input type="number" id="height" name="height" value="{{ creature.height }}"><br>

		<label for="weight">Weight</label><br>
		<input type="number" id="weight" name="weight" value="{{ creature.weight }}"><br>

		<label for="types">Types</label><br>
		<input type="text" id="types" name="types" value="{{ creature.types }}"><br>

		<label for="stats">Stats</label><br>
		<textarea id="stats" name="stats" rows="4">{{ creature.stats }}</textarea><br>
	{% endif %}


		<button type="submit">Save</button>
	</form>
	<a href="{{ url_for('index') }}">Back to list</a>

</body>
</html>

<!-- Jinja rende le pagine di frontend dinamiche in base ai dati 
forniti dal backend tramite le route.-->

<!-- Jinja è rappresentato da queste parentesi  dentro il codice html-->
